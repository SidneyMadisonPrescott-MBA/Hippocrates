<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050e1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hippocrates"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body style="margin:0"><title>Hippocrates</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"><style>:root {
  color-scheme: dark;
  --bg: #050e1c; --bg2: #0a1b32; --panel: rgba(14, 32, 56, .74); --panel2: rgba(22, 46, 76, .8);
  --line: rgba(94, 234, 212, .2); --text: #e9f2f6; --muted: #a2b8c8; --faint: #6f8aa0;
  --teal: #2dd4bf; --teal2: #5eead4; --gold: #d9b44a; --gold2: #f5d97a; --coral: #fb7185; --blue: #7aa7ff; --rose: #f0a6ca;
  --ink: #3a2a14; --r: 18px;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif; --serif: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
:root[data-theme="light"], :root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal2); }
.root { min-height: 100dvh; background: radial-gradient(1100px 700px at 50% -10%, #0e2f4d 0%, transparent 60%), radial-gradient(900px 600px at 100% 100%, #0b3a40 0%, transparent 55%), var(--bg); }

/* ---------- Stages (splash and scroll) ---------- */
.stage { position: fixed; inset: 0; overflow: hidden; z-index: 20; background: radial-gradient(900px 640px at 50% 45%, #0d3b4a 0%, #07182c 55%, #040a14 100%); }
.dust.over { z-index: 8; }
.dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.app > .dust { position: fixed; z-index: 0; opacity: .55; }
.skip { position: fixed; right: 14px; bottom: 12px; z-index: 40; background: rgba(5, 14, 28, .6); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-size: .78rem; cursor: pointer; }
.skip:hover { color: var(--text); }
.flare { position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, #ffffff 0%, #b9fff3 12%, rgba(45, 212, 191, .55) 38%, transparent 70%); }

.splashAura { position: absolute; inset: 0; background: radial-gradient(520px 520px at 50% 42%, rgba(45, 212, 191, .28), transparent 70%); animation: aura 5s ease-in-out infinite; }
.splashBody { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; padding: 20px; text-align: center; transition: opacity .7s; }
.crestWrap { position: relative; width: min(44dvh, 76vw, 430px); aspect-ratio: 514 / 620; margin-bottom: .5rem; }
.crestHero { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 26px rgba(45, 212, 191, .6)); animation: floaty 6.5s ease-in-out infinite; position: relative; z-index: 2; }
.halo { position: absolute; left: 50%; top: 50%; width: 120%; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(94, 234, 212, .35); transform: translate(-50%, -50%); animation: halo 5s ease-out infinite; }
.halo.h2 { animation-delay: 2.5s; }
.brand { margin: .3rem 0 0; font-family: var(--display); font-weight: 600; letter-spacing: .36em; padding-left: .36em; font-size: clamp(1.7rem, 6.4vw, 3.5rem); background: linear-gradient(180deg, #fff7d6 10%, #d9b44a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(217, 180, 74, .35)); }
.brandSub { margin: 0 0 .4rem; color: #bfeee6; letter-spacing: .28em; text-transform: uppercase; font-size: clamp(.68rem, 1.7vw, .9rem); }
.splashBody .ecg { width: min(620px, 92vw); }
.enterBtn { position: relative; margin-top: 1.1rem; padding: 17px 60px; border-radius: 999px; background: rgba(6, 26, 40, .7); border: 1px solid rgba(94, 234, 212, .7); color: #eafffb; font-family: var(--display); font-size: 1.05rem; letter-spacing: .5em; padding-left: calc(60px + .5em); cursor: pointer; box-shadow: 0 0 26px rgba(45, 212, 191, .5), inset 0 0 20px rgba(45, 212, 191, .25); animation: breathe 2.8s ease-in-out infinite; transition: transform .25s, box-shadow .25s; }
.enterBtn:hover, .enterBtn:focus-visible { transform: scale(1.06); box-shadow: 0 0 44px rgba(94, 234, 212, .8), inset 0 0 26px rgba(94, 234, 212, .4); outline: none; }
.enterRing { position: absolute; inset: -2px; border-radius: 999px; border: 1px solid rgba(94, 234, 212, .8); animation: ripple 2.8s ease-out infinite; pointer-events: none; }
.enterRing.r2 { animation-delay: 1.4s; }
.motto { margin: 1.1rem 0 0; font-family: var(--serif); font-style: italic; color: #cdeee8; letter-spacing: .12em; font-size: 1.15rem; opacity: .9; }
.motto i, .motto2 i { font-style: normal; color: var(--gold2); padding: 0 .35em; }
.splash.leaving .splashBody { opacity: 0; }
.splash.leaving .crestHero { animation: crestOut .9s ease-in forwards; }
.splash.leaving .flare, .scrollStage.closing .flare { animation: flare 1.1s ease-in-out forwards; }
.scrollStage.closing .flare { animation-duration: 1.5s; animation-delay: .35s; }

/* ---------- Magic scroll ---------- */
.scrollStage { background: radial-gradient(1000px 760px at 50% 50%, #0b4048 0%, #08202f 50%, #030a14 100%); animation: stageIn 1s ease both; }
.mist { position: absolute; inset: -25%; z-index: 0; background: radial-gradient(40% 35% at 30% 40%, rgba(45, 212, 191, .17), transparent 70%), radial-gradient(35% 30% at 72% 62%, rgba(94, 234, 212, .12), transparent 70%); filter: blur(30px); animation: drift 22s ease-in-out infinite alternate; }
.mist.m2 { animation-duration: 31s; animation-direction: alternate-reverse; opacity: .8; }
.scroll { --rh: 46px; position: absolute; z-index: 5; inset: 2.2dvh 2vw; display: flex; flex-direction: column; cursor: pointer; outline: none; animation: scrollIn 1.2s cubic-bezier(.2, .8, .25, 1) both; }
.scroll:focus-visible .paper { box-shadow: 0 0 0 3px var(--teal2), 0 0 60px rgba(45, 212, 191, .5); }
.scrollStage.closing .scroll { animation: scrollOut 1.6s ease-in forwards; }
.roller { position: relative; z-index: 4; flex: none; height: var(--rh); margin: 0 22px; border-radius: var(--rh); background: linear-gradient(180deg, #2e1b0c 0%, #7d4f25 20%, #d6a35e 44%, #f4cf8e 54%, #9a6a34 78%, #3c2410 100%); box-shadow: 0 10px 22px rgba(0, 0, 0, .55), 0 0 26px rgba(45, 212, 191, .4); }
.roller .cap { position: absolute; top: 50%; width: calc(var(--rh) + 16px); height: calc(var(--rh) + 16px); transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff4c8, #d9b44a 46%, #6b4c0e 100%); box-shadow: 0 0 18px rgba(94, 234, 212, .65), 0 4px 10px rgba(0, 0, 0, .5); }
.roller .cap::after { content: ''; position: absolute; inset: 32%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9fff8, #2dd4bf 55%, #0f766e); box-shadow: 0 0 16px #5eead4; animation: gem 3s ease-in-out infinite; }
.roller .cap.l { left: -26px; } .roller .cap.r { right: -26px; }
.paper { position: relative; z-index: 2; flex: 0 1 0; min-height: 0; margin: -8px 40px; overflow: hidden; animation: unroll 2.6s cubic-bezier(.22, .8, .24, 1) .55s forwards; background-color: #f0dca8; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38  0 0 0 0 .26  0 0 0 0 .1  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), radial-gradient(120% 90% at 50% 45%, #f8ebc6 0%, #efd9a1 55%, #d8b878 100%); box-shadow: inset 0 0 110px rgba(122, 78, 22, .55), inset 0 0 18px rgba(45, 212, 191, .16), 0 0 70px rgba(45, 212, 191, .45); }
.paper::after { content: ''; position: absolute; inset: 14px; border: 2px solid rgba(150, 100, 30, .7); border-radius: 6px; box-shadow: 0 0 0 5px rgba(240, 220, 168, .0), inset 0 0 0 5px rgba(120, 82, 28, .0), 0 0 18px rgba(45, 212, 191, .45), inset 0 0 18px rgba(45, 212, 191, .3); pointer-events: none; z-index: 3; }
.paperInner { position: absolute; left: 0; right: 0; top: 0; height: calc(100dvh - 4.4dvh - 2 * var(--rh) + 16px); overflow-y: auto; padding: clamp(32px, 6dvh, 64px) clamp(26px, 9vw, 150px) 130px; scrollbar-width: thin; scrollbar-color: rgba(120, 82, 28, .5) transparent; overscroll-behavior: contain; }
.spark { position: absolute; border-radius: 50%; background: radial-gradient(circle, #e6fffb 0%, #5eead4 40%, transparent 72%); box-shadow: 0 0 12px #2dd4bf; opacity: 0; animation: twinkle 3.4s ease-in-out infinite; pointer-events: none; z-index: 1; }
.oathHead { text-align: center; margin-bottom: 1.6rem; animation: fadeUp 1.4s ease 1.2s both; }
.oathCrest { width: clamp(70px, 11dvh, 120px); height: auto; filter: drop-shadow(0 0 14px rgba(45, 212, 191, .8)); }
.oathHead h2 { margin: .5rem 0 .2rem; font-family: var(--display); font-weight: 700; font-size: clamp(1.7rem, 4.6vw, 3.4rem); letter-spacing: .12em; color: #2c1f0d; text-shadow: 0 0 18px rgba(45, 212, 191, .55); }
.oathSrc { margin: 0; font-family: var(--serif); font-style: italic; color: #6b5128; font-size: clamp(.95rem, 1.6vw, 1.2rem); }
.rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 1rem; color: #0f766e; }
.rule span { height: 1px; width: min(220px, 22vw); background: linear-gradient(90deg, transparent, #0f766e); } .rule span:last-child { transform: scaleX(-1); }
.rule b { text-shadow: 0 0 10px #2dd4bf; }
.oathBody { max-width: 1080px; margin: 0 auto; }
.ink { font-family: var(--serif); font-weight: 600; font-size: clamp(1.28rem, 2.35vw, 2.1rem); line-height: 1.5; color: var(--ink); margin: 0 0 1.15em; text-align: justify; hyphens: auto; opacity: 0; animation: ink 2.2s ease-out both; -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 60%); mask-image: linear-gradient(to bottom, #000 40%, transparent 60%); -webkit-mask-size: 100% 250%; mask-size: 100% 250%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: 0 100%; mask-position: 0 100%; }
.ink.pledge { text-align: center; font-style: italic; color: #0f5f58; text-shadow: 0 0 14px rgba(45, 212, 191, .45); }
.ink.motto2 { text-align: center; font-family: var(--display); font-size: clamp(1rem, 2vw, 1.5rem); letter-spacing: .24em; color: #6b4c0e; font-weight: 700; }
.beginHint { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; padding: 56px 0 26px; background: linear-gradient(to top, rgba(216, 184, 120, .95) 20%, rgba(216, 184, 120, 0)); pointer-events: none; animation: fadeUp 1.2s ease 3.4s both; }
.beginHint span { font-family: var(--display); letter-spacing: .3em; font-size: clamp(.78rem, 1.6vw, 1rem); color: #d7fff9; background: rgba(6, 34, 42, .9); border: 1px solid rgba(94, 234, 212, .8); padding: 14px 28px 14px calc(28px + .3em); border-radius: 999px; box-shadow: 0 0 26px rgba(45, 212, 191, .7), inset 0 0 16px rgba(45, 212, 191, .3); animation: breathe 2.6s ease-in-out infinite; text-transform: uppercase; }

/* ---------- Heartbeat line ---------- */
.ecg { position: relative; overflow: hidden; color: var(--ecg-c, var(--teal)); width: 100%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.ecg svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 6px currentColor); }
.ecg path { vector-effect: non-scaling-stroke; }
.ecgMove { animation: ecgScroll var(--ecg, 5s) linear infinite; }

/* ---------- App shell ---------- */
.app { position: relative; }
.top { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px clamp(14px, 3vw, 28px); background: rgba(5, 14, 28, .82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brandRow { display: flex; align-items: center; gap: 12px; }
.brandRow img { width: 38px; height: 46px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(45, 212, 191, .6)); }
.brandRow strong { display: block; font-family: var(--display); letter-spacing: .22em; font-size: 1.05rem; color: var(--gold2); }
.brandRow span { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: .95rem; letter-spacing: .08em; }
.topRight { display: flex; align-items: center; gap: 10px; }
.sync { font-size: .72rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.sync.cloud { color: var(--teal2); }
.tabs { position: sticky; top: 66px; z-index: 11; display: flex; gap: 6px; overflow-x: auto; padding: 8px clamp(14px, 3vw, 28px); background: rgba(6, 18, 34, .82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: transparent; border: 1px solid transparent; color: var(--muted); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: .92rem; white-space: nowrap; }
.tab:hover { color: var(--text); border-color: var(--line); }
.tab.on { color: #04211f; background: linear-gradient(180deg, var(--teal2), var(--teal)); font-weight: 600; box-shadow: 0 0 18px rgba(45, 212, 191, .45); }
.main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 28px) 90px; animation: fadeUp .5s ease both; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 18px; backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.panelHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.panel h3, .panel h2 { margin: 0; font-family: var(--display); letter-spacing: .06em; font-weight: 600; font-size: 1.08rem; color: var(--gold2); }
.sub { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 4px 0 10px; }
.empty { color: var(--faint); font-style: italic; margin: 8px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; align-items: start; }
.grid .panel { margin-bottom: 0; }
.span2 { grid-column: 1 / -1; }
.miniH { margin: 14px 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .16em; color: var(--teal2); }
.link { background: none; border: none; color: var(--teal2); cursor: pointer; font-size: .86rem; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; } .row.wrap { flex-wrap: wrap; } .row.end { justify-content: flex-end; }

.btn { background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: .92rem; text-decoration: none; display: inline-flex; align-items: center; transition: background .2s, transform .15s; }
.btn:hover { background: rgba(94, 234, 212, .14); } .btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.solid { background: linear-gradient(180deg, var(--teal2), var(--teal)); color: #04211f; border-color: transparent; font-weight: 600; box-shadow: 0 0 16px rgba(45, 212, 191, .35); }
.btn.on { background: rgba(122, 167, 255, .25); border-color: var(--blue); }
.btn.ghost { background: transparent; } .btn.danger { color: var(--coral); border-color: rgba(251, 113, 133, .4); } .btn.danger.solid { background: var(--coral); color: #2b0610; box-shadow: none; }
.btn.tiny { padding: 6px 12px; font-size: .8rem; border-radius: 10px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--teal2); outline-offset: 2px; }

.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .74rem; border: 1px solid; white-space: nowrap; }
.chip.teal { color: var(--teal2); border-color: rgba(94, 234, 212, .5); background: rgba(45, 212, 191, .1); } .chip.gold { color: var(--gold2); border-color: rgba(217, 180, 74, .5); background: rgba(217, 180, 74, .1); }
.chip.coral { color: var(--coral); border-color: rgba(251, 113, 133, .5); background: rgba(251, 113, 133, .1); } .chip.blue { color: var(--blue); border-color: rgba(122, 167, 255, .5); background: rgba(122, 167, 255, .1); } .chip.rose { color: var(--rose); border-color: rgba(240, 166, 202, .5); background: rgba(240, 166, 202, .1); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.bar { height: 8px; background: rgba(255, 255, 255, .08); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--teal); transition: width .6s ease; box-shadow: 0 0 10px currentColor; color: var(--teal); }
.bar i.gold { background: var(--gold); color: var(--gold); } .bar i.blue { background: var(--blue); color: var(--blue); } .bar i.rose { background: var(--rose); color: var(--rose); } .bar i.coral { background: var(--coral); color: var(--coral); }

/* Dashboard */
.monitor { background: linear-gradient(180deg, rgba(6, 22, 36, .92), rgba(10, 30, 48, .86)); border-color: rgba(94, 234, 212, .35); box-shadow: 0 0 40px rgba(45, 212, 191, .12), inset 0 0 40px rgba(0, 0, 0, .3); }
.monitorTop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.greet { font-family: var(--serif) !important; font-size: clamp(1.5rem, 4vw, 2.2rem) !important; letter-spacing: 0 !important; color: var(--text) !important; font-weight: 600 !important; }
.why { margin: 6px 0 14px; color: var(--muted); }
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.vital { background: rgba(0, 0, 0, .28); border: 1px solid rgba(255, 255, 255, .08); border-left: 3px solid var(--teal); border-radius: 12px; padding: 12px 14px; }
.vital.gold { border-left-color: var(--gold); } .vital.blue { border-left-color: var(--blue); } .vital.rose { border-left-color: var(--rose); }
.vLabel { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.vValue { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 2rem; line-height: 1.15; color: var(--teal2); text-shadow: 0 0 14px currentColor; }
.vital.gold .vValue { color: var(--gold2); } .vital.blue .vValue { color: var(--blue); } .vital.rose .vValue { color: var(--rose); }
.vValue small { font-size: .85rem; color: var(--muted); text-shadow: none; }
.vSub { font-size: .76rem; color: var(--faint); }
.scale { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; } .scale > span { width: 60px; color: var(--muted); font-size: .86rem; }
.dot { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); cursor: pointer; font-size: 1.15rem; } .dot.num { font-size: .95rem; }
.dot.on { background: rgba(45, 212, 191, .25); border-color: var(--teal2); box-shadow: 0 0 14px rgba(45, 212, 191, .5); }
textarea.mini, .inline { width: 100%; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }
.affirm { margin: 6px 0 10px; padding: 14px 18px; border-left: 3px solid var(--gold); background: rgba(217, 180, 74, .07); border-radius: 0 12px 12px 0; font-family: var(--serif); font-size: 1.35rem; line-height: 1.45; color: #fff4cf; }
.affirm.big { font-size: clamp(1.4rem, 3vw, 2rem); }
.recover { border-color: rgba(251, 113, 133, .35); }
.recCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.recCard { background: rgba(0, 0, 0, .22); border: 1px solid var(--line); border-radius: 14px; padding: 14px; } .recCard p { margin: 0 0 6px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 12px 0 0; font-size: .9rem; } .kv dt { color: var(--faint); } .kv dd { margin: 0; color: var(--text); }
.kv.compact { font-size: .84rem; margin: 4px 0 2px; grid-template-columns: 96px 1fr; }
.chart { width: 100%; height: auto; } .chart .bar { fill: rgba(94, 234, 212, .35); } .chart .bar.now { fill: var(--teal); filter: drop-shadow(0 0 6px var(--teal)); }
.chart .axis { fill: var(--faint); font-size: 9px; } .chart .val { fill: var(--teal2); font-size: 10px; } .chart .tline { stroke: var(--gold); stroke-dasharray: 4 4; opacity: .7; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: .92rem; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.trophy { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid rgba(217, 180, 74, .4); border-radius: 12px; background: rgba(217, 180, 74, .07); } .trophy b { color: var(--gold2); font-size: 1.3rem; text-shadow: 0 0 10px var(--gold); } .trophy strong { display: block; } .trophy span { font-size: .8rem; color: var(--muted); }

/* ---------- Keyframes ---------- */

@keyframes gem { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.7); } }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes ink { 0% { opacity: 0; -webkit-mask-position: 0 100%; mask-position: 0 100%; color: #0f9a8c; text-shadow: 0 0 20px rgba(45, 212, 191, 1), 0 0 4px rgba(94, 234, 212, 1); } 25% { opacity: 1; } 100% { opacity: 1; -webkit-mask-position: 0 0; mask-position: 0 0; text-shadow: 0 0 0 rgba(45, 212, 191, 0); } }
@keyframes drift { from { transform: translate(-4%, -2%) scale(1); } to { transform: translate(5%, 4%) scale(1.15); } }
@keyframes ecgScroll { to { transform: translateX(-1200px); } }
@keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 180px)) rotate(var(--r)); } }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

}

 each interview you finish."},{key:"2030-11",label:"Nov 2030",theme:"Gratitude for the Road",remember:"Thank the people who helped you. Celebrate by writing one thank-you note."},{key:"2030-12",label:"Dec 2030",theme:"Hold the Light",remember:"Rest and keep going. Celebrate the holidays with no guilt."},{key:"2031-01",label:"Jan 2031",theme:"Keep Showing Up",remember:"Your final bachelor's semester begins. Celebrate finishing strong."},{key:"2031-02",label:"Feb 2031",theme:"Wait Well",remember:"Offers are coming. Celebrate doing something kind for yourself while you wait."},{key:"2031-03",label:"Mar 2031",theme:"Decisions Near",remember:"Keep your grades steady while decisions arrive. Celebrate staying grounded."},{key:"2031-04",label:"Apr 2031",theme:"Open the Letters",remember:"Offers and decisions. Celebrate the work that earned them."},{key:"2031-05",label:"May 2031",theme:"Commit",remember:"Choose your school. Celebrate your choice."},{key:"2031-06",label:"Jun 2031",theme:"Graduate Again",remember:"Your bachelor's degree is complete. Celebrate it."},{key:"2031-07",label:"Jul 2031",theme:"Pack Your Bags",remember:"Prepare to move and begin. Celebrate the people who walked beside you."},{key:"2031-08",label:"Aug 2031",theme:"White Coat",remember:"Medical school begins. Celebrate the girl who always wanted this."}],detail:{"2026-11":{weeks:[{n:1,range:"Nov 1 to 7",title:"Gather What You Need",supports:"You cannot build without materials. This week you collect the records and book the first class.",celebrate:"Cross off every item you finished and say thank you to yourself."},{n:2,range:"Nov 8 to 14",title:"Bring Your Whole Mind",supports:"A foundation is only as strong as what you bring to it. This week reminds you that your scholarship and your calling belong together.",celebrate:"Honor your conference work, then rest."},{n:3,range:"Nov 15 to 21",title:"Ask Clearly",supports:"Foundations need partners. This week you ask programs, schools, and hospitals for what you need.",celebrate:"Count every message and call you sent, whatever the answers were."},{n:4,range:"Nov 22 to 30",title:"Give Thanks and Go",supports:"A foundation is set when you pause to see it. This week you practice gratitude, rest, and review, then step into December ready.",celebrate:'Say out loud, "November is complete," and plan one enjoyable thing for yourself.'}],days:{"2026-11-01":"I begin this month by gathering, not by proving. Organized paperwork is the first act of a professional.","2026-11-02":"Today I book my in-person Basic Life Support (BLS) class, because the first skill I learn can save a life.","2026-11-03":"My vaccine records show that I take other people's safety seriously. I gather them with pride.","2026-11-04":"I schedule my tuberculosis (TB) test today. Small appointments are how big careers begin.","2026-11-05":"A layoff redirected me. It did not end my story. I am steering on purpose now.","2026-11-06":"I chose steady work that cares for people. I do not need anyone's permission to want stability.","2026-11-07":"This week I gathered what I need. I celebrate that I did what I said I would do.","2026-11-08":"The scholar with a paper accepted at an international conference is the same person training to care for patients. Nothing in me is wasted.","2026-11-09":"I know how to explain hard ideas so people understand them. That is a physician's skill, and I already practice it.","2026-11-10":"I have trained hundreds of people through something new and frightening. I can be the learner now, and I will be a good one.","2026-11-11":"My Praesumptio Harm Principle asks us to protect the vulnerable before harm is proven. Medicine is where that belief becomes action.","2026-11-12":"I do not have to choose between being a thinker and a healer. I am becoming both.","2026-11-13":"My paper is part of the conversation in Boston this weekend. I am a published thinker and a future doctor at the same time.","2026-11-14":"I shared my ideas with the world. I celebrate myself, and I rest, because rested people learn faster.","2026-11-15":"Asking is how doors open. This week I ask clearly and without apology.","2026-11-16":"Today I call Northside Hospital's Certified Nursing Assistant (CNA) School and ask about a December class. I trust that I belong in that room.","2026-11-17":"I sign up for a backup class. Having a plan B means I am being wise, not doubtful.","2026-11-18":"I send my questions to the programs: Is it accredited? What does it cost? Can it work around my life? A good question is a sign of intelligence.","2026-11-19":"I reach out to SafeHouse Outreach. I have served people on the streets of downtown Atlanta before. I know how to show up.","2026-11-20":"I email Emory Healthcare about observerships. Physicians say yes to people who ask well, and I ask well.","2026-11-21":"This week I asked for what I need. I celebrate every question I sent.","2026-11-22":"I am grateful for the knowledge I already carry. I am not starting from zero.","2026-11-23":"I am grateful for every person who has taught me something. One day I will be that for someone else.","2026-11-24":"I built automation teams from the ground up. I know how to start something hard and make it real. This is the same skill.","2026-11-25":"Before the holiday, I check off one thing from my list. Progress does not need to be loud.","2026-11-26":"Today I give thanks for my mind, my health, and the child who dreamed of being a doctor. She is proud of me.","2026-11-27":"Rest is part of the plan. I recover so I can show up fully.","2026-11-28":"I look at my calendar and see December waiting with a clear first date. I am ready.","2026-11-29":"I review what I gathered, asked for, and learned this month. It is a lot, and it is mine.","2026-11-30":"November is complete. I laid the foundation, and tomorrow I begin to build on it."},remember:"Every career you have built started with unglamorous groundwork, and this one is no different. This month is about records, appointments, applications, and asking good questions.",celebrate:'Look at everything you gathered, booked, and sent. Treat yourself to something you enjoy and say out loud: "I laid the foundation."'},"2026-12":{weeks:[{n:1,range:"Dec 1 to 7",title:"Get Ready to Begin",supports:"You walk into the room calmly when the paperwork and the plan are done. This week you finish enrollment and prepare.",celebrate:"Pack your bag for day one and take a short walk."},{n:2,range:"Dec 8 to 14",title:"Day One",supports:"The room is where the month happens. This week you let yourself be a beginner and walk in anyway.",celebrate:'Say out loud, "I started," and enjoy a good meal.'},{n:3,range:"Dec 15 to 21",title:"Learn With Your Hands",supports:"Walking into the room means little without practice. This week you build skill through repetition.",celebrate:"Name one skill you can do now that you could not do three weeks ago."},{n:4,range:"Dec 22 to 31",title:"Reflect and Reset",supports:"The room matters more when you pause to see what you have done. This week you rest, reflect, and look toward the new year.",celebrate:"Write your three proud moments and share one with someone you trust."}],days:{"2026-12-01":"December is the month I walk into the room. I begin by preparing with calm, not rushing with fear.","2026-12-02":"I confirm my class enrollment today. A seat in that room is a seat I earned by asking.","2026-12-03":"I handle the drug screen, identification, and vaccine paperwork. Every requirement is a small gate I walk through.","2026-12-04":"I finish my in-person Basic Life Support (BLS) class. I am learning to help a person whose heart has stopped, and that matters.","2026-12-05":"I set out what I need for my first day: comfortable shoes, a notebook, and my route on MARTA. Preparation is respect for the work.","2026-12-06":"I rest and breathe. Nerves before a first day mean it matters to me.","2026-12-07":"I have led teams and taught rooms full of people. Walking in as a student is not a step down. It is how experts are made.","2026-12-08":"This is the week I become a student of care. I let myself be a beginner.","2026-12-09":"I do not need to know everything before I start. I need to show up curious.","2026-12-10":"The skills I learn this month are real: how to move a person safely, how to take a pulse, how to listen.","2026-12-11":"If my class begins today, I walk in tall. Day one is the hardest door, and I am already through it.","2026-12-12":"I ask questions without shame. Every good clinician started by asking.","2026-12-13":"I review my notes gently. I am building memory for the hands and the heart, not only the head.","2026-12-14":"Whether my class begins today or continues, I carry myself like someone who belongs here, because I do.","2026-12-15":"I practice washing hands, taking vital signs, and moving a patient safely, again and again. Repetition is how care becomes second nature.","2026-12-16":"My hands are learning what my mind already understands. I trust the practice.","2026-12-17":"Dignity is part of every task. I treat each person as a whole human being, the way I would want my own family treated.","2026-12-18":"I made a mistake today and I learned from it. Learning in front of others is brave.","2026-12-19":"I write one short note about what I learned, with no names or private details. This is the first page of my clinical journal.","2026-12-20":"I did not know how to do this a month ago. Look at me now.","2026-12-21":"The patience I use in practice is the patience I will use at the bedside and in the research lab. I am training all of it.","2026-12-22":"I pause to see how far I came this year. I did hard things, and I did them through uncertainty.","2026-12-23":"I forgive myself for the years that felt unstable. They taught me what I truly want.","2026-12-24":"I rest this holiday with no guilt. Hospitals run on rested people.","2026-12-25":"I give myself a gift today: permission to believe this is possible.","2026-12-26":'I think of the child who dreamed of being a doctor. I tell her, "We are doing it."',"2026-12-27":"I review next year's first steps: pass the state exam, get hired, begin volunteering. Each one is a step, and I am already walking.","2026-12-28":"I write down three things I am proud of from this year, large or small.","2026-12-29":"I am not behind. I am on a path that is mine, and it has a start date.","2026-12-30":"I thank the people who supported me. Gratitude steadies the heart.","2026-12-31":"This year I decided to become a doctor, and I started. Next year I earn my first certificate. I enter the new year as someone in motion."},remember:"You are no longer only planning. This month your Certified Nursing Assistant (CNA) class begins, and you start learning hands-on care. Your class date may be December 11 or 14, or another date, so adjust the lines below to match.",celebrate:"On December 31, write down three things you are proud of from this year and mark the day you started."}}};var St=qu.themes,rr=e=>e.slice(0,7),Zu=e=>St.find(t=>t.key===e),Ks=e=>qu.detail[e],Fv=e=>{let t=parseInt(e.slice(8,10),10);return t<=7?1:t<=14?2:t<=21?3:4};function Xs(e,t={}){let n=rr(e),o=Zu(n),a=Ks(n),r=a?a.weeks.find(i=>i.n===Fv(e)):null,s=a?a.days[e]:null;return{key:n,theme:o,det:a,wk:r,line:s,mine:t[e]||""}}var un=[["emotions","Emotions","rose"],["challenges","Challenges","coral"],["skills","Medical skills","teal"],["lessons","Lessons","gold"],["competencies","Medical school competencies","blue"],["themes","Themes","gold"]],sr=[["Commitment to Learning and Growth","Professional","Continually improves through goal-setting, self-reflection, and seeking feedback.",["i learned","next time","feedback","improve","practiced","studied","reflect","growth","getting better","lesson"]],["Cultural Awareness","Professional","Recognizes how history, society, politics, and economics shape people's experiences, and values diversity.",["cultur","divers","language barrier","inequit","dispariti","priv
